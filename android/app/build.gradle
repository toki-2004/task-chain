plugins {
    id 'com.android.application'
}

android {
    namespace 'com.toki.taskchain'
    compileSdk 34

    defaultConfig {
        applicationId "com.toki.taskchain"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "1.9.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
